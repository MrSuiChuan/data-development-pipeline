name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # 3.9 是 README 承诺的下限，3.12 对齐主力开发机。两端都跑全量用例——
    # 否则"Python 3.9+"就是一句没人验证过的对外声明（ENG-002）。
    # 下限改了要同步改 README；tests/test_repo_invariants.py 会核对两者一致。
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q engine hooks tests tools
      - name: generated artifacts must match the repo
        # DEVEX-003 的验收原文：跑生成器后 git diff --exit-code，有差异即失败。
        # 单元测试里也有等价断言（tests/test_generated_surface.py、test_repo_invariants.py），
        # 这一步是把它显式挂到 CI 上：生成器改了、忘了重跑，这里直接红。
        run: |
          python tools/generate_engine_manifest.py
          python tools/build_codex_surface.py
          git diff --exit-code -- engine/.engine-manifest.json .codex-plugin hooks skills engine/templates
      - name: provenance/secret scan
        run: |
          ! rg -n -i "xhdw|alipay|复刻|调研文档|（与原版|见复刻差异" . -g '!.github/**' || exit 1
          ! rg -n "ark-[A-Za-z0-9_-]{20,}|rvk_[A-Za-z0-9_-]{20,}" . -g '!.github/**' || exit 1
          # 环境指纹（内网网段 / 带用户名的本机绝对路径）。上面两条查"来源敏感词"，这条查"环境指纹"。
          # 为什么单独有一条：2026-10-09 第一次把仓库推到公开仓库时漏出去的正是这两类，而当时
          # 上面两条都拦不住 —— 代价是重写全历史 + 强推。有了它，就算忘了跑 tools/publish_public.sh，
          # 私有仓的 CI 也会先红。
          - python tools/scan_leaks.py

  hooks:
    # 这条 job 存在的唯一理由：hook 层的失败是静默的（启动器不存在 -> 宿主 fail-open
    # -> 所有硬门失效）。必须在一个真 shell 里把 hooks.json 里的命令真跑一遍。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: adapt hooks to this platform
        run: python tools/adapt_hooks.py
      - name: hook launcher must exist on this machine
        run: python tools/adapt_hooks.py --check
      - name: really invoke the configured PreToolUse hook
        run: python -m unittest tests.test_hook_wiring -v
      - name: setup_guard decisions must not regress
        run: python -m unittest tests.test_gates.CliGateTests -v
